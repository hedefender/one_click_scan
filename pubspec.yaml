name: one_click_scan
description: "One-click document scan, OCR and delivery. Privacy first, fully local."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

# NOTE: constraints are `any` on purpose in the seed, because the seed was not
# compiled against a real toolchain. After `flutter pub get` run
# `dart pub upgrade --tighten` so they become pinned ^constraints.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.1
  shared_preferences: ^2.5.6
  camera: ^0.12.1
  gal: ^2.3.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.12.0

flutter:
  uses-material-design: true
